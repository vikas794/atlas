[project]
name = "atlas"
version = "1.0.0"
description = "AI-powered content analysis platform for technical education and research workflows"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "python-multipart==0.0.32",
    "python-dotenv==1.2.4",
    "pyyaml==6.0.3",
    "google-api-python-client==2.201.0",
    "google-auth-oauthlib==1.5.0",
    "yt-dlp[curl-cffi,default]==2026.10.21",
    "pydantic==2.14.1",
    "litellm==1.106.4",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.1",
    "httpx==0.28.1",
    "ruff==0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Pin basetemp inside the repo. The OS temp dir is ACL-restricted on some Windows
# setups, which makes the default `pytest-of-<user>` tree fail with PermissionError.
addopts = "--basetemp=.pytest_tmp"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.format]
indent-style = "space"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by line-length)
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI parameter markers are evaluated once at import time by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Header"]
