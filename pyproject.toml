[project]
name = "atlas"
version = "1.0.0"
description = "AI-powered content analysis platform for technical education and research workflows"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.1",
    "python-multipart==0.0.32",
    "python-dotenv==1.2.2",
    "pyyaml==6.0.3",
    "google-api-python-client==2.198.0",
    "google-auth-oauthlib==1.4.0",
    "google-genai==2.16.0",
    "openai==2.52.0",
    "yt-dlp==2026.7.4",
    "pymupdf==1.28.0",
    "tabulate==0.10.0",
    "pandas==3.0.5",
    "lancedb==0.36.0",
    "llama-index-core==0.14.23",
    "llama-index-embeddings-openai==0.6.0",
    "llama-index-llms-openai==0.7.10",
    "llama-index-vector-stores-lancedb==0.5.0",
    "pydantic==2.13.4",
]

[project.optional-dependencies]
legacy-gradio = [
    "gradio==6.22.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.25.3",
    "httpx==0.28.1",
    "ruff==0.11.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.format]
indent-style = "space"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by line-length)
]
