# Atlas Project Configuration
# Main configuration file for the YouTube transcript processing project

# API Configuration
api:
  openai:
    model: "openai/gpt-5-mini"
    timeout: 180  # seconds
    max_retries: 3
  youtube:
    # YouTube Data API configuration
    api_version: "v3"
    max_results: 5
    order: "relevance"
    type: "video"
    timeout: 30  # seconds

  gemini:
    model: "gemini-3.6-flash"
    timeout: 180

# Processing Configuration
processing:
  # Parallel processing settings
  workers:
    auto_detect: true
    min_workers: 2
    max_workers: 16
    cpu_ratio: 0.5  # Use 50% of available CPU cores for auto-detection
    
  # Transcript processing
  transcripts:
    language: "en"
    format: "srt"
    output_folder: "transcripts"
    
  # Summary processing
  summaries:
    output_folder: "summaries"
    file_suffix: ".json"

# File paths and directories
paths:
  # Prompt templates
  prompts:
    base_dir: "src/prompts"
    summarizer_v1: "summarizer_youtube.yaml"
    summarizer_v2: "summarizer_youtube_v2.yaml"
    default_summarizer: "summarizer_youtube_v2.yaml"
  
  outputs:
    transcripts: "transcripts"
    summaries: "summaries"
    logs: "logs"
    quiz_output: "quiz_output"

# Playlist Quiz Configuration
playlist_quiz:
  output_folder: "quiz_output"
  delay_between_requests: 2  # seconds between quizzes to avoid Gemini rate limits
  max_retries: 3             # retries per quiz if generation fails
  transcript_max_retries: 4  # derived from the retry schedule length; kept for compatibility
  transcript_retry_wait_seconds: [15, 30, 60, 120]  # explicit retry waits between attempts
  transcript_retry_jitter_seconds: 5                # bounded jitter (seconds) added to each retry wait
  transcript_delay_between_requests: 4
  transcript_min_delay_between_videos: 15           # minimum delay between different videos
  transcript_rate_limit_cooldown_seconds: 120       # pipeline-wide cooldown after any HTTP 429

# Storage Configuration (SQLite pipeline store)
storage:
  database_path: "data/atlas.sqlite3"
  artifact_root: "data/artifacts"
  cache_ttl_days: 30
  cleanup_retention_days: 90

# Logging Configuration
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "[%(levelname)s] %(message)s"
  file_logging: false
  log_file: "logs/atlas.log"

# YouTube Download Configuration
download:
  # yt-dlp options
  skip_download: true
  write_subtitles: true
  write_automatic_sub: true
  subtitles_format: "srt"
  output_template: "%(id)s.%(ext)s"

# Search Configuration
search:
  default_max_results: 10
  description_max_length: 200
  
# Environment variables (defaults, can be overridden by actual env vars)
environment:
  openrouter_api_key_env: "OPENROUTER_API_KEY"
  youtube_api_key_env: "YOUTUBE_API_KEY"
