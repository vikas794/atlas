# Atlas configuration: every setting that is not a secret. Secrets (API keys) go in .env.
#
# The file is FLAT: every key is an AtlasSettings field name (src/config/settings.py).
# It is validated at startup: an unknown key, a wrong type or an out-of-range value
# stops Atlas with a message listing each problem.
#
# Relative paths resolve against the repository root. Any key can be overridden for one
# run with ATLAS_<KEY_IN_UPPERCASE> in the environment or .env (empty values count as
# unset); NOTES_PROMPT_NAME is also accepted as a short name (see .env.example).

# --- HTTP server -----------------------------------------------------------------
host: "127.0.0.1"  # keep local: Atlas has no authentication
port: 8000
# Comma-separated browser origins allowed to call the API cross-origin. Leave empty:
# single-app mode is same-origin and the Vite dev server proxies /api.
cors_origins: ""

# --- Storage -------------------------------------------------------------------
database_path: "data/atlas.sqlite3"

# --- Secrets -------------------------------------------------------------------
# This is the NAME of the environment variable that holds the YouTube key, never the key
# itself. Put the actual value in .env (see .env.example). LLM providers, models and keys
# are managed in the app (Models and Keys pages), not here.
youtube_api_key_env: "YOUTUBE_API_KEY"

# --- Google OAuth --------------------------------------------------------------
google_creds_path: "credentials.json"
google_token_path: "token.json"
drive_max_retries: 3
drive_backoff_base_seconds: 1.0
drive_backoff_cap_seconds: 10.0

# --- Transcripts ---------------------------------------------------------------
transcript_language: "en"
transcript_output_folder: "transcripts"
transcript_min_interval_seconds: 4.0  # YouTube fetches run one at a time, at least this far apart
ytdlp_cookies_file: ""  # optional cookies.txt (Netscape) to avoid YouTube throttling/bot checks
ytdlp_cookies_from_browser: ""  # or a browser name: chrome | firefox | edge ... (use a throwaway account)

# --- Notes generation ----------------------------------------------------------
# Which LLM models and keys are used is managed on the Models and Keys pages.
notes_prompt_name: "notes_v1_2.yaml"  # the recorded prompt version is this file's own `version`
notes_request_timeout_seconds: 300.0  # one LLM call; a timeout is retried like a network error

# --- Pipeline concurrency & retries --------------------------------------------
max_concurrent_videos: 2
max_auto_retries: 4
backoff_base_seconds: 5.0
backoff_cap_seconds: 300.0
rate_limit_max_auto_retries: 6  # YouTube transcript throttling: more tries, much longer waits
rate_limit_backoff_base_seconds: 60.0
rate_limit_backoff_cap_seconds: 900.0
worker_poll_interval_seconds: 2.0
worker_shutdown_timeout_seconds: 5.0

# --- Paths ---------------------------------------------------------------------
prompts_base_dir: "src/prompts"

# --- Logging -------------------------------------------------------------------
log_level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
log_format: "%(asctime)s %(levelname)s %(name)s: %(message)s"
log_file_logging: true  # rotating file (5 MB, 3 backups), secrets redacted
log_file: "logs/atlas.log"
